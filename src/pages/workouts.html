<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Workouts</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/workouts.css">
</head>
<body>

<aside id="sidebar" class="sidebar"></aside>

<!-- =====================================================
  SECTION 4: MAIN CONTENT
===================================================== -->
<div class="main">

  <!-- 4a. Topbar -->
  <header class="topbar">
    <div class="page-title">WORKOUTS</div>
    <div class="topbar-right">
      <span class="date-badge" id="todayDate"></span>
      <select class="day-select" id="dayPicker" onchange="loadDay(this.value)">
        <option value="push">Push (Today)</option>
        <option value="pull">Pull</option>
        <option value="legs">Legs</option>
        <option value="arms">Arms</option>
        <option value="rest">Rest</option>
      </select>
    </div>
  </header>

  <div class="content">

    <!-- 4b-i. Type pills -->
    <div class="type-row">
      <span class="type-label">TYPE</span>
      <span class="type-pill active" id="pill-push" onclick="loadDay('push')">Push</span>
      <span class="type-pill"        id="pill-pull" onclick="loadDay('pull')">Pull</span>
      <span class="type-pill"        id="pill-legs" onclick="loadDay('legs')">Legs</span>
      <span class="type-pill"        id="pill-arms" onclick="loadDay('arms')">Arms</span>
      <span class="type-pill"        id="pill-rest" onclick="loadDay('rest')">Rest</span>
    </div>

    <!-- 4b-ii. Two cards -->
    <div class="cards-row">

      <!-- TODAY'S ROUTINE card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">TODAY'S ROUTINE</span>
          <span class="card-badge" id="routineBadge">PUSH DAY</span>
        </div>
        <div class="card-body">
          <!-- JS fills these in via renderRoutine() -->
          <div class="routine-meta"  id="routineMeta"></div>
          <div class="exercise-list" id="exerciseList"></div>
        </div>
      </div>

      <!-- EXPECTED LOAD card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">EXPECTED LOAD</span>
          <span class="card-badge" id="loadBadge">MUSCLE MAP</span>
        </div>
        <div class="card-body">
          <div class="load-body">
            <!-- JS fills stat numbers via renderLoad() -->
            <div class="load-stats" id="loadStats"></div>
            <div class="body-diagram-area">
              <!-- JS redraws this SVG when you switch days -->
              <svg id="bodySvg" viewBox="0 0 220 420" width="200" height="380" style="overflow:visible;"></svg>
              <div class="body-legend" id="bodyLegend"></div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /cards-row -->
  </div><!-- /content -->
</div><!-- /main -->

<!-- =====================================================
  SECTION 5: MODAL HTML
  Placed at end of body so it layers on top of everything.
  Both divs start hidden (display:none in CSS).
  JS flips them to display:block when the button is clicked.
===================================================== -->

<!-- The orange floating button -->
<button id="logBtn" onclick="openModal()">+ LOG SET</button>

<!-- Dark overlay — clicking it closes the modal -->
<div id="modalBackdrop" onclick="closeModal()"></div>

<!-- The modal box -->
<div id="modal">
  <h2>Log Workout</h2>

  <!-- Exercise name text field -->
  <label for="inputExercise">Exercise</label>
  <input type="text" id="inputExercise" placeholder="e.g. Bench Press" autocomplete="off"/>

  <!-- Sets table — rows are added dynamically by addSetRow() -->
  <table id="setsTable">
    <thead>
      <tr>
        <th>Set</th>
        <th>Weight (kg)</th>
        <th>Reps</th>
        <th>RPE</th>
        <th></th><!-- remove button column -->
      </tr>
    </thead>
    <tbody id="setsBody">
      <!-- addSetRow() inserts <tr> elements here -->
    </tbody>
  </table>

  <!-- Button to add another set row -->
  <button class="btn-add-set" onclick="addSetRow()">+ Add Set</button>

  <!-- Optional notes field -->
  <label for="inputNotes">Notes</label>
  <textarea id="inputNotes" placeholder="Optional — e.g. felt strong, shoulder tight..."></textarea>

  <!-- Cancel / Save -->
  <div class="modal-actions">
    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    <button class="btn-save"   onclick="saveEntry()">Save</button>
  </div>
</div>

<!-- Brief confirmation message after saving -->
<div id="toast"></div>

<script src="js/store.js"></script>
<script src="js/workouts.js"></script>
<script src="js/modal.js"></script>
<script src="js/sidebar.js"></script>

</body>
</html>
