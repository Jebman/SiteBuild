<!-- ── Main ── -->
<main>
    <div class="container">

        <!-- 01 / Library -->
        <section class="section" id="library">
            <div class="section-header">
                <span class="section-num">01</span>
                <span class="section-title">Library</span>
                <span class="stats-badge" id="statsBadge">0 books</span>
                <div class="section-actions">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search books…" />
                    <select class="sort-select" id="sortSelect">
                        <option value="title-asc">Title A→Z</option>
                        <option value="title-desc">Title Z→A</option>
                        <option value="author-asc">Author A→Z</option>
                        <option value="author-desc">Author Z→A</option>
                        <option value="rating-desc">Rating ★ high</option>
                        <option value="rating-asc">Rating ★ low</option>
                        <option value="date-desc" selected>Newest first</option>
                        <option value="date-asc">Oldest first</option>
                        <option value="status">By status</option>
                    </select>
                    <button class="btn-primary" id="addBookBtn">+ Add</button>
                </div>
            </div>

            <div id="bookGrid" class="book-grid">
                <!-- rendered by JS -->
            </div>

            <div id="emptyState" class="empty-state" style="display:none;">
                <div class="icon">📚</div>
                <p>No books logged yet</p>
                <div class="hint">Click “+ Add” to start your library</div>
            </div>
        </section>

    </div>
</main>

<!-- ── Modal ── -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Add Book</h2>
            <button class="modal-close" id="modalClose">×</button>
        </div>
        <form id="bookForm" autocomplete="off">
            <input type="hidden" id="editId" value="" />

            <div class="form-group">
                <label for="bookTitle">Title *</label>
                <input type="text" id="bookTitle" placeholder="e.g. The Great Gatsby" required />
            </div>

            <div class="form-group">
                <label for="bookAuthor">Author *</label>
                <input type="text" id="bookAuthor" placeholder="e.g. F. Scott Fitzgerald" required />
            </div>

            <div class="form-group">
                <label for="bookCover">Cover URL (optional)</label>
                <input type="url" id="bookCover" placeholder="https://example.com/cover.jpg" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="bookRating">Rating (1–5)</label>
                    <select id="bookRating">
                        <option value="0">—</option>
                        <option value="1">★</option>
                        <option value="2">★★</option>
                        <option value="3">★★★</option>
                        <option value="4">★★★★</option>
                        <option value="5">★★★★★</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bookStatus">Status</label>
                    <select id="bookStatus">
                        <option value="want-to-read">Want to Read</option>
                        <option value="reading">Reading</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="bookNotes">Notes (optional)</label>
                <textarea id="bookNotes" placeholder="Any thoughts or highlights…"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-primary outline" id="modalCancel">Cancel</button>
                <button type="submit" class="btn-primary" id="modalSubmit">Save</button>
            </div>
        </form>
    </div>
</div>
